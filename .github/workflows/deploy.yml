# Hisaab: on every push to main —
#   1. check: typecheck, lint, tests, web build
#   2. web: publish the web app to GitHub Pages (https://<you>.github.io/hisaab/)
#   3. android: build the signed Android app and attach it to a new Release
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create Releases with the APK
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  web:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HISAAB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hisaab-release.jks"
            echo "HISAAB_KEYSTORE=$RUNNER_TEMP/hisaab-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::HISAAB_KEYSTORE_BASE64 secret not set — building with a temporary debug key. Updates will need an uninstall."
          fi
      - name: Build APK
        working-directory: android
        env:
          HISAAB_KEYSTORE_PASSWORD: ${{ secrets.HISAAB_KEYSTORE_PASSWORD }}
          HISAAB_VERSION_CODE: ${{ github.run_number }}
          HISAAB_VERSION_NAME: 0.3.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk ../release/Hisaab-0.3.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hisaab-android
          path: release/*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-0.3.${{ github.run_number }}
          name: Hisaab for Android 0.3.${{ github.run_number }}
          body: |
            Install: open this page on your Android phone, tap the .apk below, allow "Install unknown apps" for your browser if asked.
            Installing a newer version keeps your data.
          files: release/*.apk
          make_latest: true
